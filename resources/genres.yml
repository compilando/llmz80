# Typologies Studio's designer prompt can suggest.
#
# This is inspiration, not a schema: `typology_hints()` reads only `name` and
# `description` from each entry below to describe a kind of game a designer
# might propose. Nothing in Studio validates a design against a typology --
# v3 did that (fixed terrain shape, a fixed enemy count, a fixed roster of
# collectibles per genre), and it is why eighteen typologies produced one
# generated game. A design may match one of these, blend several, or be none
# of them.
schema_version: 1

genres:

  - id: maze_chase
    name: Maze chase
    description: Clear a maze of pellets while pursuers close in.

  - id: single_screen_collect
    name: Single-screen collect
    description: Gather everything on one arcade screen while avoiding hazards.

  - id: platform_single_screen
    name: Single-screen platformer
    description: Cross ledges to collect keys before the nasties reach you.

  - id: platform_rooms
    name: Room-to-room platformer
    description: Work through connected caverns, each with its own hazards.

  - id: climb
    name: Climbing game
    description: Ascend girders and ladders while obstacles fall past you.

  - id: shooter_vertical
    name: Vertical shooter
    description: Fly upward against descending waves of attackers.

  - id: shooter_horizontal
    name: Horizontal shooter
    description: Fly across the screen shooting what comes at you.

  - id: fixed_shooter
    name: Fixed shooter
    description: Hold the base line and shoot the formation before it lands.

  - id: breakout
    name: Brick breaker
    description: Bounce a ball into the wall until every brick is gone.

  - id: snake
    name: Growing snake
    description: Eat and grow without running into your own tail.

  - id: sokoban
    name: Block pusher
    description: Push crates onto their marks in the fewest moves.

  - id: top_down_adventure
    name: Top-down adventure
    description: Explore rooms, find what opens the way onward.

  - id: dodge_falling
    name: Dodge the falling
    description: Stay alive under a sky that keeps dropping things on you.

  - id: lane_racer
    name: Lane racer
    description: Weave between traffic at speed without touching anything.

  - id: static_defence
    name: Static defence
    description: Hold one position against everything that comes for it.

  - id: boss_arena
    name: Boss arena
    description: One large opponent, one room, one pattern to learn.

  - id: dig_and_collect
    name: Dig and collect
    description: Tunnel through earth to reach what is buried in it.

  - id: memory_sequence
    name: Memory sequence
    description: Watch the pattern, then repeat it back without a mistake.
