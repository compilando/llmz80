schema_version: 4
metadata:
  slug: reference-maze
  title: Reference Maze
  brief: A maze chase. Walk the maze collecting every pellet while one chaser hunts you; QAOP move, SPACE
    starts.
  author: LLMZ80 Studio
  language: es
  created_at: '2026-08-11T06:13:08.346394Z'
  updated_at: '2026-08-11T06:13:08.356985Z'
target:
  platform: spectrum
  video_mode: spectrum_bitmap
  frame_hz: 50
presentation:
  style: colourful maze arcade
  palette: []
  show_score: true
  show_lives: true
  hud_rows: 2
controls:
  bindings:
    left: O
    right: P
    up: Q
    down: A
    action: SPACE
budgets:
  binary_bytes: 24576
  static_data_bytes: 8192
  stack_bytes: 1024
  max_entities: 16
  frame_budget_cycles: 70000
tiles:
- id: wall
  char: '#'
  traits:
  - solid
- id: floor
  char: .
  traits:
  - walkable
entities:
- id: player
  kind: player
  count: 1
  notes: walks one cell per press and collects pellets
- id: enemy
  kind: chaser
  count: 1
  notes: patrols horizontally; contact costs a life
- id: collectible
  kind: pellet
  count: 8
  notes: worth ten points; clear them all to finish a screen
observables: []
mechanics:
- The player walks one cell per key press through a maze of walls.
- Touching a pellet collects it, scores ten and removes it from the screen.
- The chaser hunts the player; contact costs a life and restarts the screen.
- Clearing every pellet on a screen advances to the next one.
- Losing the last life ends the game and returns to the title.
