# The model Studio thinks with. `temperature` is deliberately absent: it was
# removed from this model family and sending it is a 400, not a value that
# gets ignored. So is `reasoning_effort` -- its replacement,
# `output_config.effort`, already defaults to the high setting Studio wants,
# so naming it here would only be restating the default.
anthropic:
  model: claude-opus-5

  # What each *kind* of question is worth asking of, overriding `model` above.
  # A role is a kind and not a call site: `exam` is the brief examiner, the
  # coherence examiner and the runtime examiner, and `art` is both grid
  # sources. Delete a line to send that role to `model`.
  #
  # `design` and `program` stay on Opus and are not a saving worth making:
  # every later stage reads what the design wrote, and every writer attempt
  # the compiler refuses costs another one.
  #
  # `art` and `exam` are the ones moved, and they are the ones to watch. A
  # sheet is a transcription and a verdict is a comparison, so neither should
  # need the better model -- but that is an expectation and not a measurement,
  # and a cheaper model that gets drawings refused pays for itself twice over
  # in redraws. `llmz80/studio/spend.py` now prints what each stage cost, so
  # this is a line to move back if the sprite stage starts retrying.
  models:
    art: claude-sonnet-5
    exam: claude-sonnet-5

# The most one `llmz80 make` may spend before it stops on its own.
#
# `studio-projects/cesar-mondongo-basket` is why there is a number here at
# all: it ran for 3.5 hours across 19 model calls and ended on `Your credit
# balance is too low to access the Anthropic API`, three attempts into a
# program stage, because nothing in the pipeline knew what it had spent or
# had any authority to stop.
#
# Both ceilings are hard and either one stops the run. `calls` is the one that
# catches a runaway early: the retries here multiply rather than add --
# `structured(attempts=2)` inside `write_program(attempts=5)` inside three
# examination passes -- and the theoretical worst case is about 100 calls, all
# of them individually reasonable.
budget:
  dollars: 12.0
  calls: 60

# The native toolchain for each target. `cpct_path` is optional under
# `amstrad_cpc`: without it, `llmz80.core.toolchain.resolve_cpct_path` tries
# $CPCT_PATH, then this repository's vendored checkout, then the conventional
# install locations -- accepting only one whose own SDCC has been built.
compiler:
  spectrum:
    c_compiler: "zcc"
    asm_compiler: "z80asm"
    params: "+zx -vn -O3 -clib=sdcc_iy"
  amstrad_cpc:
    c_compiler: "sdcc"
    asm_compiler: "z80asm"
    # CPCtelera's prebuilt assembly bindings require the classic stack ABI.
    params: "-mz80 --sdcccall 0 --no-std-crt0"

# The emulator `llmz80 play` starts, for a person to look at. This is *not*
# what the quality gates drive: `quality/emulator_smoke.py` keeps its own
# preference order, ZEsarUX first on both machines, because it is the only
# emulator here that speaks a remote protocol the harness can read memory
# through.
emulator:
  spectrum:
    name: "zesarux"
    params: "--machine 48k"
  amstrad_cpc:
    name: "cap32"
    params: "--machine 6128"
