schema_version: 1
name: core-bilingual-v1
cases:
  - id: spectrum_flea_es
    platform: spectrum
    language: es
    prompt: Una pulga que salta por la pantalla y rebota en los bordes
    archetype: animation
    required_capabilities: [sprite, animation, bounds, frame_pacing]
  - id: spectrum_flea_en
    platform: spectrum
    language: en
    prompt: A flea that jumps around the screen and bounces at the edges
    archetype: animation
    required_capabilities: [sprite, animation, bounds, frame_pacing]
  - id: spectrum_collect_es
    platform: spectrum
    language: es
    prompt: Juego de recoger diez monedas con teclado y marcador
    archetype: collect_game
    required_capabilities: [input, sprite, collision, hud, score]
  - id: spectrum_collect_en
    platform: spectrum
    language: en
    prompt: Collect ten coins with keyboard controls and an on-screen score
    archetype: collect_game
    required_capabilities: [input, sprite, collision, hud, score]
  - id: spectrum_pong_es
    platform: spectrum
    language: es
    prompt: Pong para un jugador con marcador y reinicio de la pelota
